rule_id: "RULE-007"
name: "Suspicious Process Execution / Reverse Shell"
description: "Detects interactive shell spawning, reverse socket connections, and suspicious utility usage indicative of command injection or interactive persistence."
severity: "High"
technique_id: "T1059.004"
technique_name: "Command and Scripting Interpreter: Unix Shell"
tactic: "Execution"
criteria:
  event_category: "process"
  event_type: "process_spawn"
  flagged_patterns:
    - "/dev/tcp/"
    - "nc -e"
    - "nc -c"
    - "ncat -e"
    - "python -c import socket"
    - "curl | bash"
    - "wget | bash"
    - "bash -i"
    - "sh -i"
false_positives:
  - "Custom development automation scripts using sockets for network testing."
recommended_steps:
  - "Kill the suspect process PID immediately."
  - "Inspect parent process tree and executing user account."
  - "Extract full command line arguments and network endpoints."
